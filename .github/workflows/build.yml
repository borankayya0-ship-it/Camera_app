name: Otomatik Kamera Uygulaması Oluştur ve APK Derle

on:
  push:
    branches: [ "main", "master", "ana" ]
  workflow_dispatch:

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Repoyu Hazırla
      uses: actions/checkout@v4

    - name: 2. Java 17 Ortamını Kur
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. Kamera Uygulaması Kodlarını ve Proje Yapısını Oluştur
      run: |
        mkdir -p app/src/main/java/com/example/cameraapp
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # Root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10'
            }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # settings.gradle
        cat << 'EOF' > settings.gradle
        include ':app'
        rootProject.name = "CameraApp"
        EOF

        # app/build.gradle
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'kotlin-android'

        android {
            compileSdk 33
            namespace 'com.example.cameraapp'
            defaultConfig {
                applicationId "com.example.cameraapp"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.9.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.8.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            
            def camerax_version = "1.2.2"
            implementation "androidx.camera:camera-core:${camerax_version}"
            implementation "androidx.camera:camera-camera2:${camerax_version}"
            implementation "androidx.camera:camera-lifecycle:${camerax_version}"
            implementation "androidx.camera:camera-view:${camerax_version}"
        }
        EOF

        # AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.hardware.camera.any" />
            <uses-permission android:name="android.permission.CAMERA" />
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="Pro Kamera"
                android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # activity_main.xml (Arayüz)
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <androidx.constraintlayout.widget.ConstraintLayout 
            xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:app="http://schemas.android.com/apk/res-auto"
            android:layout_width="match_parent"
            android:layout_height="match_parent">
            <androidx.camera.view.PreviewView
                android:id="@+id/viewFinder"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />
            <Button
                android:id="@+id/image_capture_button"
                android:layout_width="100dp"
                android:layout_height="100dp"
                android:layout_marginBottom="50dp"
                android:text="ÇEK"
                app:layout_constraintBottom_toBottomOf="parent"
                app:layout_constraintEnd_toEndOf="parent"
                app:layout_constraintStart_toStartOf="parent" />
        </androidx.constraintlayout.widget.ConstraintLayout>
        EOF

        # MainActivity.kt (Kamera Mantık Kodu)
        cat << 'EOF' > app/src/main/java/com/example/cameraapp/MainActivity.kt
        package com.example.cameraapp

        import android.Manifest
        import android.content.pm.PackageManager
        import android.os.Bundle
        import android.widget.Button
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import androidx.camera.core.CameraSelector
        import androidx.camera.core.ImageCapture
        import androidx.camera.core.ImageCaptureException
        import androidx.camera.core.Preview
        import androidx.camera.lifecycle.ProcessCameraProvider
        import androidx.camera.view.PreviewView
        import androidx.core.app.ActivityCompat
        import androidx.core.content.ContextCompat

        class MainActivity : AppCompatActivity() {
            private var imageCapture: ImageCapture? = null
            private lateinit var viewFinder: PreviewView

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                viewFinder = findViewById(R.id.viewFinder)

                if (allPermissionsGranted()) {
                    startCamera()
                } else {
                    ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.CAMERA), 10)
                }

                findViewById<Button>(R.id.image_capture_button).setOnClickListener { takePhoto() }
            }

            private fun startCamera() {
                val cameraProviderFuture = ProcessCameraProvider.getInstance(this)
                cameraProviderFuture.addListener({
                    val cameraProvider: ProcessCameraProvider = cameraProviderFuture.get()
                    val preview = Preview.Builder().build().also {
                        it.setSurfaceProvider(viewFinder.surfaceProvider)
                    }
                    imageCapture = ImageCapture.Builder().build()
                    val cameraSelector = CameraSelector.DEFAULT_BACK_CAMERA
                    try {
                        cameraProvider.unbindAll()
                        cameraProvider.bindToLifecycle(this, cameraSelector, preview, imageCapture)
                    } catch (exc: Exception) {
                        Toast.makeText(this, "Kamera açılamadı", Toast.LENGTH_SHORT).show()
                    }
                }, ContextCompat.getMainExecutor(this))
            }

            private fun takePhoto() {
                val imageCapture = imageCapture ?: return
                imageCapture.takePicture(
                    ContextCompat.getMainExecutor(this),
                    object : ImageCapture.OnImageCapturedCallback() {
                        override fun onCaptureSuccess(image: androidx.camera.core.ImageProxy) {
                            Toast.makeText(baseContext, "Fotoğraf Başarıyla Çekildi!", Toast.LENGTH_SHORT).show()
                            image.close()
                        }
                        override fun onError(exc: ImageCaptureException) {
                            Toast.makeText(baseContext, "Hata oluştu", Toast.LENGTH_SHORT).show()
                        }
                    }
                )
            }

            private fun allPermissionsGranted() = ContextCompat.checkSelfPermission(
                baseContext, Manifest.permission.CAMERA
            ) == PackageManager.PERMISSION_GRANTED
        }
        EOF

    - name: 4. Gradle Wrapper Kurulumu
      run: |
        gradle wrapper

    - name: 5. APK Derleme İşlemi (Build)
      run: ./gradlew assembleDebug --stacktrace

    - name: 6. Hazır APK Dosyasını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Kamera-Uygulamasi-APK
        path: app/build/outputs/apk/debug/*.apk
        
