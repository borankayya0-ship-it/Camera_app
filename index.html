<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Kamera Uygulaması</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background-color: #000000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            display: none;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-capture {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #ffffff;
            border: 4px solid rgba(255, 255, 255, 0.5);
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .btn-capture::after {
            content: '';
            width: 52px;
            height: 52px;
            background: #ffffff;
            border-radius: 50%;
            border: 2px solid #000;
        }

        .btn-capture:hover {
            background: #f0f0f0;
            transform: scale(1.08);
        }

        .flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
        }

        .flash.active {
            animation: flashAnim 0.3s ease-out;
        }

        @keyframes flashAnim {
            0% { opacity: 0.8; }
            100% { opacity: 0; }
        }

        .status-msg {
            position: absolute;
            top: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <div id="flash" class="flash"></div>
        <div class="status-msg" id="status">Kamera Hazırlanıyor...</div>
        
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas"></canvas>

        <div class="controls">
            <button class="btn" id="switch-btn" onclick="switchCamera()">
                🔄 Çevir
            </button>
            
            <button class="btn btn-capture" onclick="takePhoto()" aria-label="Fotoğraf Çek"></button>
            
            <a id="download-link" style="display: none;"></a>
            <button class="btn" id="download-btn" onclick="downloadPhoto()" style="opacity: 0.5; pointer-events: none;">
                💾 İndir
            </button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('status');
        const downloadBtn = document.getElementById('download-btn');
        const downloadLink = document.getElementById('download-link');
        const flash = document.getElementById('flash');
        
        let currentStream = null;
        let facingMode = "environment"; // "user" (ön) veya "environment" (arka)
        let lastCapturedImage = null;

        async function initCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: facingMode,
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                },
                audio: false
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                statusText.innerText = "Kamera Aktif";
            } catch (err) {
                console.error("Kamera erişim hatası:", err);
                statusText.innerText = "Kamera Erişimi Reddedildi veya Bulunamadı!";
            }
        }

        function switchCamera() {
            facingMode = facingMode === "user" ? "environment" : "user";
            initCamera();
        }

        function takePhoto() {
            if (!currentStream) return;

            // Flaş efekti
            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active'), 300);

            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Aynalama düzeltmesi (Ön kamera için)
            if (facingMode === "user") {
                context.translate(canvas.width, 0);
                context.scale(-1, 1);
            }

            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            lastCapturedImage = canvas.toDataURL('image/jpeg', 0.95);
            
            // İndirme butonunu aktif et
            downloadBtn.style.opacity = "1";
            downloadBtn.style.pointerEvents = "auto";
            statusText.innerText = "Fotoğraf Çekildi!";
        }

        function downloadPhoto() {
            if (!lastCapturedImage) return;
            
            const timeStamp = new Date().toISOString().replace(/[:.]/g, "-");
            downloadLink.href = lastCapturedImage;
            downloadLink.download = `kamera-${timeStamp}.jpg`;
            downloadLink.click();
        }

        // Uygulamayı başlat
        window.addEventListener('DOMContentLoaded', initCamera);
    </script>
</body>
  </html>
